<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Calculator.css">
</head>
<body>
    <div id="container">
        <p id="result"></p>
        <div id="button">
            <button class="operator" onclick="add()">+</button>
        <button class="number" onclick="n7()">7</button>
        <button class="number" onclick="n8()">8</button>
        <button class="number" onclick="n9()">9</button>

        <button class="operator" onclick="sub()">-</button>
        <button class="number" onclick="n4()">4</button>
        <button class="number" onclick="n5()">5</button>
        <button class="number" onclick="n6()">6</button>

        <button class="operator" onclick="mul()">*</button>
        <button class="number" onclick="n1()">1</button>
        <button class="number" onclick="n2()">2</button>
        <button class="number" onclick="n3()">3</button>

        <button class="operator" onclick="div()">/</button>
        <button class="number" onclick="n0()">0</button>
        <button class="number" onclick="dot()">.</button>
        <button class="number" onclick="eq()">=</button>

        <button class="operator" onclick="C()">C</button>
        </div>
        
    </div>
    <script src="Calculator.js"></script>
</body>
</html>
