<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Stopwatch.css">
</head>
<body>
    <p id="top">Stopwatch</p>
    <div id="container">
        <p id="time">00:00:00:00</p>
        <button class="button" id="start" onclick="startTimer()">Start</button>
        <button class="button" id="stop" onclick="stopTimer()">Stop</button>
        <button class="button" id="reset" onclick="resetTimer()">Reset</button><br>
    </div>
    <script src="Stopwatch.js"></script>
</body>
</html>
